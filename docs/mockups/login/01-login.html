<div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-primary-fixed-dim/30 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-secondary-container/40 blur-3xl pointer-events-none"></div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-xl p-space-lg md:p-space-xl flex flex-col relative z-10 transition-all duration-300">
<div class="flex items-center justify-center gap-space-sm mb-space-lg">

<span class="font-headline-lg text-headline-lg text-on-surface tracking-tight"><br></span>
</div>
<div class="text-center mb-space-lg">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-space-xs">
        Bienvenido de nuevo
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
        Ingresa tus credenciales para acceder a tu panel financiero
      </p>
</div>
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="email">
          Correo electrónico
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none select-none">
            mail
          </span>
<input class="w-full h-11 pl-10 pr-4 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:shadow-sm transition-all placeholder:text-outline" id="email" name="email" placeholder="nombre@ejemplo.com" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between"><label class="font-label-md text-label-md text-on-surface font-medium" for="password">Contraseña</label></div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none select-none">
            lock
          </span>
<input class="w-full h-11 pl-10 pr-11 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:shadow-sm transition-all placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3 text-secondary hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">
              visibility
            </span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-1"><div class="flex items-center gap-space-xs"><input class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" id="remember" name="remember" type="checkbox"><label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Recordar mi sesión</label></div><a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant hover:underline transition-colors" href="#">¿Olvidaste tu contraseña?</a></div>
<button class="w-full h-11 bg-primary text-on-primary font-headline-md text-title-sm font-semibold rounded-lg hover:bg-on-primary-fixed-variant active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs shadow-md shadow-primary/20 mt-2" type="submit">
<span class="">Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-space-lg pt-space-md flex flex-col items-center gap-space-sm">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
        ¿No tienes una cuenta? 
        <a class="font-label-md text-label-md text-primary font-semibold hover:underline ml-1" href="#">
          Regístrate aquí
        </a>
</p>

</div>
</div>
<script>
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('passwordIcon');

    if (togglePasswordBtn && passwordInput && passwordIcon) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</div></main>
